# Canonical filter thresholds — single source of truth.
# Read by limo/utils.py:one_hots_to_passes_all and generate_molecules.py's filter chain.
# Also referenced by tests/test_filters.py.
mw_min: 150   # Lipinski Ro5 has no MW lower bound; 150 still rejects fragments (<100) but allows aspirin (180), ibuprofen (206), etc.
mw_max: 500
rot_bonds_max: 8
hbd_max: 5
hba_max: 10
qed_min: 0.5
sa_max: 4.5
n_aromatic_min: 1
max_consec_double: 4
max_consec_triple: 2
min_ring_size: 5      # renamed from ring_size_min per CK-3 (code reads min_ring_size / max_ring_size)
max_ring_size: 7      # renamed from ring_size_max per CK-3
pains_catalogs: ["PAINS_A", "PAINS_B", "PAINS_C", "BRENK", "NIH", "ZINC"]
